name: CI

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    name: "${{ matrix.group }} - Julia ${{ matrix.version }}"
    strategy:
      fail-fast: false
      # The version list per group is mirrored in test/test_groups.toml.
      matrix:
        group: ['Core', 'Interface', 'QA']
        version: ['lts', '1', 'pre']
        exclude:
          - group: 'Interface'
            version: 'pre'
          - group: 'QA'
            version: 'pre'
    uses: "SciML/.github/.github/workflows/tests.yml@v1"
    with:
      julia-version: "${{ matrix.version }}"
      group: "${{ matrix.group }}"
      num-threads: "4"
      coverage: true
    secrets: "inherit"
